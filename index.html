<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Apps</title>
<style>
  :root {
    --bg: #f4f3f0;
    --card: #fbfaf8;
    --card-hover: #ffffff;
    --line: #e2dfd9;
    --line-hover: #b9b5ad;
    --ink: #2e3138;
    --muted: #7a7d85;
    --accent: #5f7a8c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #23252b;
      --card: #2a2d34;
      --card-hover: #30333b;
      --line: #383b44;
      --line-hover: #565a66;
      --ink: #e3e4e8;
      --muted: #9a9da7;
      --accent: #9db4c4;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 22px 64px; }

  header { padding: 60px 0 20px; text-align: center; }
  h1 {
    margin: 0;
    font-size: clamp(2rem, 6vw, 2.8rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  header p {
    margin: 14px auto 0;
    max-width: 30em;
    color: var(--muted);
    font-size: 1.02rem;
    text-wrap: balance;
  }

  section { margin-top: 44px; }
  h2 {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0 0 14px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }
  .tile {
    position: relative;
    display: block;
    padding: 20px 44px 20px 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    color: inherit;
    text-decoration: none;
    transition: transform .18s ease, background .18s ease, border-color .18s ease;
  }
  .tile h3 {
    margin: 0 0 5px;
    font-size: 1.02rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .tile p { margin: 0; color: var(--muted); font-size: 0.88rem; }

  a.tile::after {
    content: "\2192";
    position: absolute;
    top: 19px;
    right: 18px;
    color: var(--muted);
    font-size: 1.05rem;
    transition: transform .18s ease, color .18s ease;
  }
  a.tile:hover, a.tile:focus-visible {
    transform: translateY(-2px);
    background: var(--card-hover);
    border-color: var(--line-hover);
    outline: none;
  }
  a.tile:hover::after, a.tile:focus-visible::after {
    transform: translateX(3px);
    color: var(--accent);
  }
  a.tile:active { transform: translateY(0); }

  .tile.soon { padding-right: 20px; }
  .tile.soon h3, .tile.soon p { opacity: .45; }
  .badge {
    display: inline-block;
    margin-top: 12px;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  footer {
    margin-top: 64px;
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
  }
  @media (prefers-reduced-motion: reduce) {
    .tile, a.tile::after { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Music Apps</h1>
    <p>AP free-response practice, classroom tools, and skill drills.</p>
  </header>

  <main id="sections"></main>

  <footer>Mr. LaGamma</footer>
</div>

<script>
/* =====================================================================
   YOUR APP LIST — this is the only part you ever need to edit.

   folder: must match the folder name in your GitHub repository exactly.
   A tile turns into a working link automatically once that folder
   contains an index.html. Until then it shows "Coming soon".

   To add an app: copy one line, change the three values.
   To remove an app: delete its line.
   ===================================================================== */
const SECTIONS = [
  { title: "AP FRQ", apps: [
    { name: "Melodic Dictation",                    folder: "melodic-dictation",   desc: "Hear a melody and notate it on the staff." },
    { name: "Harmonic Dictation",                   folder: "harmonic-dictation",  desc: "Notate the outer voices and analyze with Roman numerals." },
    { name: "Chorale Realization & Figured Bass",   folder: "chorale-writer",      desc: "Realize four-voice chorales with part-writing feedback." },
    { name: "Harmonize a Melody",                   folder: "harmonize-a-melody",  desc: "Write a bass line and harmonies for a given melody." },
  ]},
  { title: "Classroom", apps: [
    { name: "Composition Sketchpad",  folder: "composition-sketchpad",  desc: "Sketch and notate your own musical ideas." },
    { name: "Live Notation Board",    folder: "live-notation-board",    desc: "Follow along and answer on a shared staff in class." },
  ]},
  { title: "Practice Apps", apps: [
    { name: "Chorale Analysis",         folder: "chorale-analyzer",        desc: "Check an SATB chorale for part-writing errors." },
    { name: "Rhythm Reader",            folder: "rhythm-reader",           desc: "Tap along to notated rhythms." },
    { name: "Interval Trainer",         folder: "interval-trainer",        desc: "Identify and build intervals." },
    { name: "Secondary Dominants",      folder: "secondary-dominants",     desc: "Spell and identify secondary dominants." },
    { name: "Scales, Triads & 7ths",    folder: "scales-triads-sevenths",  desc: "Drill scales, triads, and seventh chords." },
  ]},
];
/* ===================== end of the part you edit ===================== */

const main = document.getElementById("sections");

SECTIONS.forEach(group => {
  const section = document.createElement("section");
  const h2 = document.createElement("h2");
  h2.textContent = group.title;
  const grid = document.createElement("div");
  grid.className = "grid";

  group.apps.forEach(app => {
    const tile = document.createElement("div");
    tile.className = "tile soon";
    tile.innerHTML = "<h3></h3><p></p><span class='badge'>Coming soon</span>";
    tile.querySelector("h3").textContent = app.name;
    tile.querySelector("p").textContent = app.desc;
    grid.appendChild(tile);

    // If the app's folder exists on the site, swap the tile for a real link.
    fetch(app.folder + "/index.html", { method: "HEAD" })
      .then(r => {
        if (!r.ok) return;
        const link = document.createElement("a");
        link.className = "tile";
        link.href = app.folder + "/";
        link.target = "_blank";
        link.rel = "noopener";
        link.innerHTML = "<h3></h3><p></p>";
        link.querySelector("h3").textContent = app.name;
        link.querySelector("p").textContent = app.desc;
        tile.replaceWith(link);
      })
      .catch(() => {});
  });

  section.appendChild(h2);
  section.appendChild(grid);
  main.appendChild(section);
});
</script>
</body>
</html>
