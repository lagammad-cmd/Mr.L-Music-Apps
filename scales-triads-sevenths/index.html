<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 10px; display: flex; justify-content: center; }
    .card { background: white; padding: 20px; border-radius: 16px; width: 100%; max-width: 560px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    .label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; text-align: center; }
    select { width: 100%; padding: 10px 12px; margin-bottom: 14px; border-radius: 8px; border: 1px solid #dfe1e5; font-weight: 600; color: #1a73e8; background-color: #fff; cursor: pointer; outline: none; font-size: 13px; }
    .session-bar { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
    .session-bar label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
    .session-bar select { margin-bottom: 0; flex: 1; }
    .score-pill { background: #f1f3f4; border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 600; white-space: nowrap; border: 1px solid #ddd; color: #333; }
    .progress-bar-wrap { height: 4px; background: #eee; border-radius: 4px; margin-bottom: 14px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: #1a73e8; border-radius: 4px; transition: width 0.3s; }
    #chord-name { font-size: 22px; font-weight: 800; color: #333; margin-bottom: 16px; min-height: 70px; display: flex; align-items: center; justify-content: center; text-align: center; background: #f8f9fa; border-radius: 8px; padding: 12px; border-left: 5px solid #1a73e8; }
    .piano-container { margin-bottom: 18px; user-select: none; }
    .piano { position: relative; height: 130px; display: flex; background: #222; padding: 2px; border-radius: 4px; border: 2px solid #222; overflow: hidden; }
    .white-key { flex: 1; background: #fff; border: 1px solid #ddd; border-radius: 0 0 4px 4px; cursor: pointer; position: relative; z-index: 1; transition: background 0.1s; }
    .white-key.selected { background: #d2e3fc; border-color: #1a73e8; }
    .white-key.is-root { background: #ceead6 !important; border-color: #1e8e3e !important; }
    .white-key.highlight-q { background: #fce8b2 !important; border-color: #f9ab00 !important; }
    .white-key .key-label { position: absolute; bottom: 6px; width: 100%; text-align: center; font-size: 11px; color: #999; font-weight: bold; pointer-events: none; }
    .black-key { position: absolute; top: 0; height: 60%; background: #333; border-radius: 0 0 4px 4px; cursor: pointer; z-index: 2; border: 1px solid #000; transition: background 0.1s; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; }
    .black-key.selected { background: #1a73e8; }
    .black-key.is-root { background: #1e8e3e !important; }
    .black-key.highlight-q { background: #f9ab00 !important; }
    .black-key .key-label { font-size: 9px; color: #ccc; pointer-events: none; text-align: center; line-height: 1.1; font-weight: bold; }
    .blind-mode .key-label { display: none !important; }
    .note-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 18px; }
    .note-btn { padding: 9px 0; cursor: pointer; border: 1px solid #dfe1e5; background: #fff; font-weight: 600; border-radius: 6px; font-size: 12px; transition: all 0.15s; color: #333; }
    .note-btn.selected { background: #1a73e8; color: #fff; border-color: #174ea6; }
    .note-btn.is-root { background: #1e8e3e !important; color: white !important; }
    .note-btn.correct-flash { background: #1e8e3e !important; color: white !important; }
    .note-btn.wrong-flash { background: #d32f2f !important; color: white !important; }
    .actions { display: flex; gap: 10px; }
    button.primary { background: #1e8e3e; color: white; border: none; padding: 13px; flex: 2; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: bold; }
    button.primary:hover { background: #187230; }
    button.secondary { background: #f1f3f4; color: #3c4043; border: 1px solid #dadce0; padding: 13px; flex: 1; border-radius: 8px; cursor: pointer; font-size: 13px; }
    #msg { margin-top: 12px; font-weight: bold; height: 22px; text-align: center; font-size: 15px; }
    .summary-overlay { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: white; border-radius: 16px; z-index: 10; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
    .summary-overlay.show { display: flex; }
    .summary-overlay h2 { font-size: 28px; font-weight: 800; color: #333; margin-bottom: 8px; }
    .summary-overlay .big-score { font-size: 56px; font-weight: 900; color: #1a73e8; line-height: 1; margin: 12px 0; }
    .summary-overlay .sub { font-size: 15px; color: #666; margin-bottom: 20px; }
    .summary-overlay .grade { font-size: 22px; font-weight: 700; margin-bottom: 24px; }
    button.restart-btn { background: #1a73e8; color: white; border: none; padding: 14px 32px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button.restart-btn:hover { background: #1558b0; }
    .card-wrap { position: relative; }
  </style>
</head>
<body>
<div class="card card-wrap">
  <div class="label">Practice Category</div>
  <select id="mode-select" onchange="onModeChange()">
    <optgroup label="Key Identification">
      <option value="keyId">Identify the Highlighted Key</option>
    </optgroup>
    <optgroup label="Scales">
      <option value="majorScales">Major Scales</option>
      <option value="minorScales">Natural Minor</option>
      <option value="harmonicMinor">Harmonic Minor</option>
      <option value="melodicMinor">Melodic Minor (Ascending)</option>
    </optgroup>
    <optgroup label="Chords">
      <option value="triads">Triads (Maj, Min, Dim, Aug)</option>
      <option value="sevenths">7th Chords (All Types)</option>
    </optgroup>
    <optgroup label="Expert">
      <option value="allKeys">Expert Mode (Unlabeled Keys)</option>
    </optgroup>
  </select>

  <div class="session-bar">
    <label>Questions:</label>
    <select id="q-count-select" onchange="resetSession()">
      <option value="0">Unlimited</option>
      <option value="5">5</option>
      <option value="10">10</option>
      <option value="15">15</option>
      <option value="20">20</option>
      <option value="25">25</option>
    </select>
    <div class="score-pill" id="score-display">— / —</div>
  </div>

  <div class="progress-bar-wrap" id="progress-wrap" style="display:none">
    <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
  </div>

  <div id="chord-name">Initializing...</div>

  <div class="piano-container">
    <div id="piano" class="piano"></div>
  </div>

  <div class="label" id="note-label">Note Names</div>
  <div id="grid-wrap">
    <div class="note-grid" id="grid"></div>
  </div>

  <div class="actions" id="actions-row">
    <button class="primary" id="submit-btn" onclick="check()">Submit Answer</button>
    <button class="secondary" onclick="showAnswer()">Hint</button>
  </div>
  <div id="msg"></div>

  <div class="summary-overlay" id="summary">
    <h2>Session Complete!</h2>
    <div class="big-score" id="sum-score"></div>
    <div class="sub" id="sum-sub"></div>
    <div class="grade" id="sum-grade"></div>
    <button class="restart-btn" onclick="restartSession()">Play Again</button>
  </div>
</div>

<script>
const library = {
  keyId: (function() {
    const whites = ["C","D","E","F","G","A","B"];
    const blacks = ["C#","D#","F#","G#","A#","Db","Eb","Gb","Ab","Bb"];
    return [...whites,...blacks].map(n => ({ q: n, a: [n], isKeyId: true }));
  })(),
  majorScales: [
    { q: "C Major Scale", a: ["C","D","E","F","G","A","B"] },
    { q: "G Major Scale", a: ["G","A","B","C","D","E","F#"] },
    { q: "D Major Scale", a: ["D","E","F#","G","A","B","C#"] },
    { q: "A Major Scale", a: ["A","B","C#","D","E","F#","G#"] },
    { q: "E Major Scale", a: ["E","F#","G#","A","B","C#","D#"] },
    { q: "F Major Scale", a: ["F","G","A","Bb","C","D","E"] },
    { q: "Bb Major Scale", a: ["Bb","C","D","Eb","F","G","A"] },
    { q: "Eb Major Scale", a: ["Eb","F","G","Ab","Bb","C","D"] },
    { q: "Ab Major Scale", a: ["Ab","Bb","C","Db","Eb","F","G"] },
    { q: "Db Major Scale", a: ["Db","Eb","F","Gb","Ab","Bb","C"] },
    { q: "Gb Major Scale", a: ["Gb","Ab","Bb","Cb","Db","Eb","F"] },
    { q: "B Major Scale", a: ["B","C#","D#","E","F#","G#","A#"] }
  ],
  minorScales: [
    { q: "A Natural Minor", a: ["A","B","C","D","E","F","G"] },
    { q: "E Natural Minor", a: ["E","F#","G","A","B","C","D"] },
    { q: "B Natural Minor", a: ["B","C#","D","E","F#","G","A"] },
    { q: "D Natural Minor", a: ["D","E","F","G","A","Bb","C"] },
    { q: "G Natural Minor", a: ["G","A","Bb","C","D","Eb","F"] },
    { q: "C Natural Minor", a: ["C","D","Eb","F","G","Ab","Bb"] }
  ],
  harmonicMinor: [
    { q: "A Harmonic Minor", a: ["A","B","C","D","E","F","G#"] },
    { q: "E Harmonic Minor", a: ["E","F#","G","A","B","C","D#"] },
    { q: "D Harmonic Minor", a: ["D","E","F","G","A","Bb","C#"] },
    { q: "C Harmonic Minor", a: ["C","D","Eb","F","G","Ab","B"] },
    { q: "G Harmonic Minor", a: ["G","A","Bb","C","D","Eb","F#"] }
  ],
  melodicMinor: [
    { q: "A Melodic Minor", a: ["A","B","C","D","E","F#","G#"] },
    { q: "E Melodic Minor", a: ["E","F#","G","A","B","C#","D#"] },
    { q: "D Melodic Minor", a: ["D","E","F","G","A","B","C#"] },
    { q: "G Melodic Minor", a: ["G","A","Bb","C","D","E","F#"] }
  ],
  triads: [
    { q: "C Major Triad", a: ["C","E","G"] },
    { q: "G Major Triad", a: ["G","B","D"] },
    { q: "F Major Triad", a: ["F","A","C"] },
    { q: "A Minor Triad", a: ["A","C","E"] },
    { q: "E Minor Triad", a: ["E","G","B"] },
    { q: "D Minor Triad", a: ["D","F","A"] },
    { q: "B Diminished Triad", a: ["B","D","F"] },
    { q: "F# Diminished Triad", a: ["F#","A","C"] },
    { q: "Ab Augmented Triad", a: ["Ab","C","E"] },
    { q: "C Augmented Triad", a: ["C","E","G#"] }
  ],
  sevenths: [
    { q: "Cmaj7", a: ["C","E","G","B"] },
    { q: "G7 (Dominant)", a: ["G","B","D","F"] },
    { q: "Amin7", a: ["A","C","E","G"] },
    { q: "Dmin7", a: ["D","F","A","C"] },
    { q: "Bø7 (Half-Dim)", a: ["B","D","F","A"] },
    { q: "G#°7 (Fully-Dim)", a: ["G#","B","D","F"] },
    { q: "Ebmaj7", a: ["Eb","G","Bb","D"] },
    { q: "Bb7", a: ["Bb","D","F","Ab"] }
  ]
};

const alphabet = ["C","C#","Db","D","D#","Eb","E","F","F#","Gb","G","G#","Ab","A","A#","Bb","B"];
const WHITE_NOTES = ["C","D","E","F","G","A","B","C"];
const BLACK_KEYS = [
  { n: "C#", alt: "Db", after: 0, label: "C#\nDb" },
  { n: "D#", alt: "Eb", after: 1, label: "D#\nEb" },
  { n: "F#", alt: "Gb", after: 3, label: "F#\nGb" },
  { n: "G#", alt: "Ab", after: 4, label: "G#\nAb" },
  { n: "A#", alt: "Bb", after: 5, label: "A#\nBb" }
];

let selected = new Set();
let current;
let sessionTotal = 0, sessionCorrect = 0, sessionAnswered = 0;
let awaitingNext = false;

function getLimit() { return parseInt(document.getElementById('q-count-select').value); }
function isKeyIdMode() { return document.getElementById('mode-select').value === 'keyId'; }

function normalize(n) {
  const map = {"Db":"C#","Eb":"D#","Gb":"F#","Ab":"G#","Bb":"A#","Cb":"B","Fb":"E","E#":"F","B#":"C"};
  return map[n] || n;
}
function isSameNote(a, b) { return normalize(a) === normalize(b); }

function resetSession() {
  sessionCorrect = 0; sessionAnswered = 0;
  sessionTotal = getLimit(); awaitingNext = false;
  document.getElementById('summary').classList.remove('show');
  updateScoreDisplay(); updateProgress(); next();
}

function updateScoreDisplay() {
  const el = document.getElementById('score-display');
  el.textContent = sessionTotal === 0
    ? (sessionAnswered > 0 ? sessionCorrect + ' / ' + sessionAnswered : '— / —')
    : sessionCorrect + ' / ' + sessionAnswered;
}

function updateProgress() {
  const wrap = document.getElementById('progress-wrap');
  const fill = document.getElementById('progress-fill');
  if (sessionTotal > 0) {
    wrap.style.display = 'block';
    fill.style.width = Math.round((sessionAnswered / sessionTotal) * 100) + '%';
  } else {
    wrap.style.display = 'none';
  }
}

function onModeChange() { resetSession(); }

function init() {
  const piano = document.getElementById('piano');
  const wWidth = 100 / WHITE_NOTES.length;

  WHITE_NOTES.forEach((note, idx) => {
    const div = document.createElement('div');
    div.className = 'white-key';
    div.dataset.note = note;
    div.dataset.idx = idx;
    div.innerHTML = `<span class="key-label">${note}</span>`;
    div.onclick = () => { if (!isKeyIdMode()) toggle(note); };
    piano.appendChild(div);
  });

  BLACK_KEYS.forEach(bk => {
    const div = document.createElement('div');
    div.className = 'black-key';
    div.style.width = (wWidth * 0.75) + '%';
    div.style.left = ((bk.after + 1) * wWidth - (wWidth * 0.375)) + '%';
    div.dataset.note = bk.n;
    div.dataset.alt = bk.alt;
    const labelEl = document.createElement('span');
    labelEl.className = 'key-label';
    labelEl.style.whiteSpace = 'pre';
    labelEl.textContent = bk.label;
    div.appendChild(labelEl);
    div.onclick = () => { if (!isKeyIdMode()) toggle(bk.n); };
    piano.appendChild(div);
  });

  const grid = document.getElementById('grid');
  alphabet.forEach(n => {
    const b = document.createElement('button');
    b.className = 'note-btn';
    b.innerText = n;
    b.dataset.note = n;
    b.onclick = () => {
      if (awaitingNext) return;
      if (isKeyIdMode()) checkKeyId(n);
      else toggle(n);
    };
    grid.appendChild(b);
  });

  resetSession();
}

function toggle(n) {
  if (awaitingNext) return;
  if (selected.has(n)) selected.delete(n); else selected.add(n);
  updateUI();
}

function updateUI() {
  const mode = document.getElementById('mode-select').value;
  const isExpert = mode === "allKeys";
  const isKI = isKeyIdMode();
  const rootNote = current ? normalize(current.a[0]) : null;
  const questionNoteNorm = isKI && current ? normalize(current.q) : null;

  document.getElementById('piano').classList.toggle('blind-mode', isExpert || isKI);
  document.getElementById('grid-wrap').classList.toggle('blind-mode', isExpert && !isKI);

  document.querySelectorAll('.white-key').forEach(el => {
    const note = el.dataset.note;
    const idx = parseInt(el.dataset.idx);
    el.classList.remove('highlight-q','selected','is-root');
    if (isKI) {
      if (questionNoteNorm && normalize(note) === questionNoteNorm && idx < 7) {
        el.classList.add('highlight-q');
      }
    } else {
      const isSel = selected.has(note);
      const isRoot = rootNote && normalize(note) === rootNote;
      if (isSel && isRoot) el.classList.add('is-root');
      else if (isSel) el.classList.add('selected');
    }
  });

  document.querySelectorAll('.black-key').forEach(el => {
    const note = el.dataset.note;
    const alt = el.dataset.alt;
    el.classList.remove('highlight-q','selected','is-root');
    if (isKI) {
      if (questionNoteNorm && (normalize(note) === questionNoteNorm || (alt && normalize(alt) === questionNoteNorm))) {
        el.classList.add('highlight-q');
      }
    } else {
      const isSel = selected.has(note) || (alt && selected.has(alt));
      const isRoot = rootNote && normalize(note) === rootNote;
      if (isSel && isRoot) el.classList.add('is-root');
      else if (isSel) el.classList.add('selected');
    }
  });

  document.querySelectorAll('.note-btn').forEach(el => {
    el.classList.remove('selected','is-root');
    if (!isKI) {
      const note = el.dataset.note;
      const isSel = selected.has(note);
      const isRoot = rootNote && normalize(note) === rootNote;
      if (isSel && isRoot) el.classList.add('is-root');
      else if (isSel) el.classList.add('selected');
    }
  });

  document.getElementById('note-label').textContent = isKI ? 'Select the note name' : 'Note Names';
  document.getElementById('submit-btn').style.display = isKI ? 'none' : '';
  document.getElementById('actions-row').style.display = isKI ? 'none' : '';
}

function checkKeyId(chosen) {
  if (awaitingNext) return;
  const correct = isSameNote(chosen, current.q);
  sessionAnswered++; if (correct) sessionCorrect++;
  updateScoreDisplay(); updateProgress();

  const chosenBtn = document.querySelector(`.note-btn[data-note="${chosen}"]`);
  if (chosenBtn) chosenBtn.classList.add(correct ? 'correct-flash' : 'wrong-flash');
  if (!correct) {
    const cb = [...document.querySelectorAll('.note-btn')].find(b => isSameNote(b.dataset.note, current.q));
    if (cb) cb.classList.add('correct-flash');
  }
  const m = document.getElementById('msg');
  m.innerText = correct ? '✓ Correct!' : '✗ That\'s ' + current.q;
  m.style.color = correct ? '#1e8e3e' : '#d32f2f';
  awaitingNext = true;
  setTimeout(() => {
    document.querySelectorAll('.note-btn').forEach(b => b.classList.remove('correct-flash','wrong-flash'));
    if (sessionTotal > 0 && sessionAnswered >= sessionTotal) showSummary(); else next();
  }, 800);
}

function check() {
  if (awaitingNext) return;
  const user = Array.from(selected).map(normalize).sort();
  const ans = current.a.map(normalize).sort();
  const correct = user.join(',') === ans.join(',');
  sessionAnswered++; if (correct) sessionCorrect++;
  updateScoreDisplay(); updateProgress();
  const m = document.getElementById('msg');
  if (correct) {
    m.innerText = "✓ Correct!"; m.style.color = "#1e8e3e";
    awaitingNext = true;
    setTimeout(() => {
      awaitingNext = false;
      if (sessionTotal > 0 && sessionAnswered >= sessionTotal) showSummary(); else next();
    }, 900);
  } else {
    m.innerText = "Try again!"; m.style.color = "#d32f2f";
  }
}

function next() {
  awaitingNext = false;
  const mode = document.getElementById('mode-select').value;
  let pool;
  if (mode === "allKeys") pool = Object.values(library).flat().filter(x => !x.isKeyId);
  else if (mode === "keyId") pool = library.keyId;
  else pool = library[mode];
  current = pool[Math.floor(Math.random() * pool.length)];
  document.getElementById('chord-name').innerText = isKeyIdMode() ? 'Name the highlighted key' : current.q;
  document.getElementById('msg').innerText = "";
  selected.clear(); updateUI();
}

function showAnswer() {
  document.getElementById('msg').innerHTML = `Notes: <span style="color:#d32f2f">${current.a.join(', ')}</span>`;
}

function showSummary() {
  const pct = Math.round((sessionCorrect / sessionTotal) * 100);
  let grade, gColor;
  if (pct >= 90) { grade = 'Excellent!'; gColor = '#1e8e3e'; }
  else if (pct >= 75) { grade = 'Good job!'; gColor = '#1a73e8'; }
  else if (pct >= 60) { grade = 'Keep practicing!'; gColor = '#f9ab00'; }
  else { grade = 'More practice needed'; gColor = '#d32f2f'; }
  document.getElementById('sum-score').textContent = sessionCorrect + ' / ' + sessionTotal;
  document.getElementById('sum-sub').textContent = pct + '% correct';
  document.getElementById('sum-grade').innerHTML = '<span style="color:' + gColor + '">' + grade + '</span>';
  document.getElementById('summary').classList.add('show');
}

function restartSession() {
  document.getElementById('summary').classList.remove('show');
  resetSession();
}

window.onload = init;
</script>
</body>
</html>
