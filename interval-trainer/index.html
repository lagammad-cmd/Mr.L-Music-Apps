<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interval Trainer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
      padding: 2rem 1.75rem;
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    h2 { font-size: 22px; font-weight: 600; color: #1a1a2e; margin-bottom: 6px; }
    .sub { font-size: 14px; color: #888; margin-bottom: 1.75rem; }

    .mode-label {
      font-size: 11px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
      min-height: 16px;
    }

    .q-box {
      font-size: 2.4rem;
      font-weight: 600;
      color: #2c2c54;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    /* Staff display */
    .q-box.staff { min-height: 150px; }
    .q-box svg { width: 100%; max-width: 300px; height: auto; display: block; }

    .controls-row { display: flex; gap: 8px; margin-bottom: 1rem; }

    .btn-listen {
      flex: 1;
      background: #7c6fcd;
      color: #fff;
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      transition: background 0.15s;
    }
    .btn-listen:hover { background: #5e52b0; }
    .btn-listen:active { background: #4a3e9c; transform: scale(0.98); }

    .btn-mode {
      background: #f4f2ff;
      color: #7c6fcd;
      border: 1.5px solid #c5bff5;
      padding: 12px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-mode.active { background: #7c6fcd; color: #fff; border-color: #7c6fcd; }

    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }

    .btn-opt {
      background: #fafafa;
      border: 1.5px solid #e0e0e0;
      color: #333;
      padding: 12px 4px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    .btn-opt:hover:not(:disabled) { background: #f0eeff; border-color: #7c6fcd; color: #5e52b0; }
    .btn-opt.correct { background: #e8f8f0; border-color: #2ecc71; color: #1a8a4a; }
    .btn-opt.wrong { background: #fff0f0; border-color: #e74c3c; color: #c0392b; }

    .btn-reveal {
      background: none;
      border: 1.5px dashed #ddd;
      color: #aaa;
      padding: 10px;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
      font-size: 13px;
      transition: border-color 0.12s, color 0.12s;
    }
    .btn-reveal:hover { border-color: #bbb; color: #777; }

    .feedback { margin-top: 14px; font-weight: 600; font-size: 15px; min-height: 24px; color: #888; letter-spacing: 0.2px; }

    .btn-start {
      background: #7c6fcd;
      color: #fff;
      border: none;
      padding: 14px 20px;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: background 0.15s;
    }
    .btn-start:hover { background: #5e52b0; }

    .score-row { display: flex; justify-content: center; gap: 18px; margin-bottom: 1rem; font-size: 13px; color: #aaa; flex-wrap: wrap; }
    .score-row span { font-weight: 600; color: #555; }

    /* Settings chips */
    .settings { margin-bottom: 1.25rem; display: flex; flex-direction: column; gap: 8px; }
    .chip-group { display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; }
    .chip-label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; width: 62px; text-align: right; }
    .chip {
      background: #fafafa;
      border: 1.5px solid #e0e0e0;
      color: #777;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    .chip.on { background: #7c6fcd; border-color: #7c6fcd; color: #fff; }

    .hidden { display: none; }
  </style>
  <!-- VexFlow for staff notation (the app falls back to letter names if this can't load) -->
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.5/build/cjs/vexflow.js"></script>
</head>
<body>
<div class="card">

  <div id="startScreen">
    <h2>Interval Trainer</h2>
    <p class="sub">Staff, letter-name &amp; ear training</p>
    <button class="btn-start" onclick="startApp()">Start Practice</button>
  </div>

  <div id="gameScreen" class="hidden">
    <div class="score-row">
      <div>Streak: <span id="streak">0</span></div>
      <div>Score: <span id="score">0</span></div>
      <div>First-try: <span id="accuracy">&ndash;</span></div>
    </div>

    <div class="settings">
      <div class="chip-group" id="typeChips">
        <div class="chip-label">Quiz</div>
        <button class="chip on" data-type="staff">Staff</button>
        <button class="chip on" data-type="names">Letters</button>
        <button class="chip on" data-type="ear">Ear</button>
      </div>
      <div class="chip-group" id="dirChips">
        <div class="chip-label">Direction</div>
        <button class="chip on" data-dir="asc">Ascending</button>
        <button class="chip on" data-dir="desc">Descending</button>
      </div>
      <div class="chip-group" id="clefChips">
        <div class="chip-label">Clef</div>
        <button class="chip on" data-clef="treble">Treble</button>
        <button class="chip on" data-clef="bass">Bass</button>
      </div>
    </div>

    <div class="mode-label" id="modeLabel"></div>
    <div class="q-box" id="qBox">?</div>
    <div class="controls-row" id="hearRow">
      <button class="btn-listen" onclick="playSound()">&#9835; Listen Again</button>
      <button class="btn-mode" id="harmBtn" onclick="toggleHarm()">Harmonic</button>
    </div>
    <div class="grid" id="grid"></div>
    <button class="btn-reveal" onclick="revealAnswer()">I'm stuck &mdash; show me the answer</button>
    <div class="feedback" id="feedback"></div>
  </div>

</div>

<script>
  /* ---------- Theory data ----------
     steps = diatonic letter distance (2nd = 1, 3rd = 2, ...)
     semis = semitones. Tracking both lets us spell intervals correctly
     (e.g. a M3 above E♭ is G, not F##). */
  const INTERVALS = {
    m2:  { steps: 1, semis: 1,  long: 'Minor 2nd' },
    M2:  { steps: 1, semis: 2,  long: 'Major 2nd' },
    m3:  { steps: 2, semis: 3,  long: 'Minor 3rd' },
    M3:  { steps: 2, semis: 4,  long: 'Major 3rd' },
    P4:  { steps: 3, semis: 5,  long: 'Perfect 4th' },
    Tri: { steps: 3, semis: 6,  long: 'Tritone (A4 / d5)' },
    P5:  { steps: 4, semis: 7,  long: 'Perfect 5th' },
    m6:  { steps: 5, semis: 8,  long: 'Minor 6th' },
    M6:  { steps: 5, semis: 9,  long: 'Major 6th' },
    m7:  { steps: 6, semis: 10, long: 'Minor 7th' },
    M7:  { steps: 6, semis: 11, long: 'Major 7th' },
    P8:  { steps: 7, semis: 12, long: 'Perfect Octave' }
  };
  const INTERVAL_KEYS = Object.keys(INTERVALS);

  const LETTERS   = ['C','D','E','F','G','A','B'];
  const LETTER_PC = [0, 2, 4, 5, 7, 9, 11];

  // A note is { dia, acc }: dia = octave*7 + letterIndex (C4 = 28), acc = -1/0/+1
  const RANGES = {
    treble: { lo: 28, hi: 40 },  // C4 .. A5
    bass:   { lo: 17, hi: 27 }   // F2 .. B3
  };

  function midiOf(n) {
    const oct = Math.floor(n.dia / 7), idx = n.dia % 7;
    return (oct + 1) * 12 + LETTER_PC[idx] + n.acc;
  }
  function freqOf(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }
  function accSym(acc) { return acc === 1 ? '\u266F' : acc === -1 ? '\u266D' : ''; }
  function noteName(n) { return LETTERS[n.dia % 7] + accSym(n.acc); }
  // Arrow showing which way the second note moves from the first
  function dirArrow(q) { return q.desc ? '↘' : '↗'; }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function randInt(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }

  /* Build a correctly spelled interval question.
     Rejects double accidentals and notes outside the clef's comfortable range. */
  function buildQuestion(intName, desc, clef) {
    const { lo, hi } = RANGES[clef];
    const iv = INTERVALS[intName];
    for (let tries = 0; tries < 500; tries++) {
      // Tritone: randomly spell as an augmented 4th or diminished 5th
      const steps = intName === 'Tri' ? pick([3, 4]) : iv.steps;
      const root = { dia: randInt(lo, hi), acc: pick([0, 0, 0, 1, -1]) };
      const rootMidi = midiOf(root);
      const tDia = desc ? root.dia - steps : root.dia + steps;
      if (tDia < lo || tDia > hi) continue;
      const tMidi = desc ? rootMidi - iv.semis : rootMidi + iv.semis;
      const tAcc = tMidi - midiOf({ dia: tDia, acc: 0 });
      if (Math.abs(tAcc) > 1) continue;
      return { interval: intName, desc, clef, root, target: { dia: tDia, acc: tAcc }, rootMidi, tMidi };
    }
    throw new Error('Could not build question');
  }

  /* ---------- Staff rendering (VexFlow) ---------- */
  function vexAvailable() { return typeof Vex !== 'undefined' && Vex.Flow; }

  function vexKey(n) {
    return LETTERS[n.dia % 7].toLowerCase() + '/' + Math.floor(n.dia / 7);
  }

  function drawStaff(q, container, harmonic) {
    const VF = Vex.Flow;
    container.innerHTML = '';
    const W = 260, H = 170;
    const renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
    renderer.resize(W, H);
    const ctx = renderer.getContext();

    const stave = new VF.Stave(10, 40, W - 20);
    stave.addClef(q.clef);
    stave.setContext(ctx).draw();

    let tickables, beats;
    if (harmonic) {
      // Chord: keys must be listed lowest -> highest so accidental indexes line up
      const pair = [q.root, q.target].sort((a, b) => midiOf(a) - midiOf(b) || a.dia - b.dia);
      const chord = new VF.StaveNote({ clef: q.clef, keys: pair.map(vexKey), duration: 'w' });
      pair.forEach((n, i) => { if (n.acc) chord.addModifier(new VF.Accidental(n.acc === 1 ? '#' : 'b'), i); });
      tickables = [chord];
      beats = 4;
    } else {
      // Melodic: notes appear in the order they are played
      tickables = [q.root, q.target].map(n => {
        const sn = new VF.StaveNote({ clef: q.clef, keys: [vexKey(n)], duration: 'q', auto_stem: true });
        if (n.acc) sn.addModifier(new VF.Accidental(n.acc === 1 ? '#' : 'b'), 0);
        return sn;
      });
      beats = 2;
    }

    const voice = new VF.Voice({ num_beats: beats, beat_value: 4 });
    voice.setMode(VF.Voice.Mode.SOFT);
    voice.addTickables(tickables);
    new VF.Formatter().joinVoices([voice]).format([voice], 120);
    voice.draw(ctx, stave);

    // Make the SVG scale to its container
    const svg = container.querySelector('svg');
    if (svg) {
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      svg.removeAttribute('width');
      svg.removeAttribute('height');
    }
  }

  // Draw the staff, or fall back to letters if VexFlow isn't available
  function showStaff(q, harmonic) {
    const box = document.getElementById('qBox');
    try {
      if (!vexAvailable()) throw new Error('VexFlow not loaded');
      box.classList.add('staff');
      drawStaff(q, box, harmonic);
    } catch (e) {
      console.warn(e);
      box.classList.remove('staff');
      box.textContent = noteName(q.root) + (harmonic ? ' + ' : ' ' + dirArrow(q) + ' ') + noteName(q.target);
    }
  }

  /* ---------- Audio (unchanged piano-ish synth) ---------- */
  const PARTIALS = [
    [1,    0.58,   0,     'triangle'],
    [2,    0.22,   1.3,   'sine'],
    [3,    0.13,  -2.0,   'sine'],
    [4,    0.075,  3.1,   'sine'],
    [5,    0.052,  1.7,   'sine'],
    [6,    0.034, -1.4,   'sine'],
    [7,    0.020,  4.2,   'sine'],
    [8,    0.012, -3.0,   'sine'],
  ];
  const PARTIAL_DECAY = [2.8, 1.8, 1.1, 0.7, 0.5, 0.35, 0.25, 0.18];

  let audioCtx, masterGain, clipper, reverbSend, reverbGain, outBus;
  const chorusGains = [];

  function makeSoftClipper(ctx) {
    const ws = ctx.createWaveShaper();
    const n = 256, curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i * 2) / n - 1;
      curve[i] = (3 * x) / (2 + Math.abs(3 * x));
    }
    ws.curve = curve;
    ws.oversample = '4x';
    return ws;
  }

  function makeReverb(ctx, duration, decay, preDelay) {
    const rate = ctx.sampleRate, length = Math.floor(rate * duration), preSamples = Math.floor(rate * preDelay);
    const buf = ctx.createBuffer(2, length, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < length; i++) {
        const t = i / rate;
        const noise = (Math.random() * 2 - 1);
        const er = (i < preSamples + rate * 0.08) ? Math.exp(-t * 22) * noise * 0.6 : 0;
        const tail = (i >= preSamples) ? Math.exp(-(i - preSamples) / (rate * decay)) * noise : 0;
        d[i] = er + tail;
      }
    }
    const conv = ctx.createConvolver();
    conv.buffer = buf;
    return conv;
  }

  function addChorus(ctx, source, destination) {
    const taps = [{ delay: 0.009, rate: 0.32, depth: 0.0018, pan: -0.6 }, { delay: 0.013, rate: 0.27, depth: 0.0022, pan: 0.6 }];
    taps.forEach(tap => {
      const delay = ctx.createDelay(0.05);
      delay.delayTime.value = tap.delay;
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      lfo.frequency.value = tap.rate;
      lfoGain.gain.value = tap.depth;
      lfo.connect(lfoGain);
      lfoGain.connect(delay.delayTime);
      lfo.start();
      const panner = ctx.createStereoPanner();
      panner.pan.value = tap.pan;
      const g = ctx.createGain();
      g.gain.value = 0.22;
      chorusGains.push(g);
      source.connect(delay);
      delay.connect(g);
      g.connect(panner);
      panner.connect(destination);
    });
  }

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    clipper = makeSoftClipper(audioCtx);
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.72;
    const reverb = makeReverb(audioCtx, 1.6, 0.32, 0.012);
    reverbSend = audioCtx.createGain();
    reverbGain = audioCtx.createGain();
    reverbSend.gain.value = 1.0;
    reverbGain.gain.value = 0.30;
    // Final output stage: gentle limiter so stacked notes + reverb can't clip
    outBus = audioCtx.createDynamicsCompressor();
    outBus.threshold.value = -12;
    outBus.knee.value = 8;
    outBus.ratio.value = 10;
    outBus.attack.value = 0.003;
    outBus.release.value = 0.2;
    const outGain = audioCtx.createGain();
    outGain.gain.value = 0.85;
    outBus.connect(outGain);
    outGain.connect(audioCtx.destination);

    clipper.connect(masterGain);
    masterGain.connect(outBus);
    masterGain.connect(reverbSend);
    reverbSend.connect(reverb);
    reverb.connect(reverbGain);
    reverbGain.connect(outBus);
    addChorus(audioCtx, masterGain, outBus);
  }

  // Original synthesized piano, kept as a fallback if the samples can't load
  function playSynthNote(freq, startTime, velocity) {
    const vel = velocity || (0.75 + Math.random() * 0.18);
    const attack = 0.006 + (1 - vel) * 0.008;
    const decay = 0.32, sustain = 0.30 * vel, release = 1.3, totalLen = 1.7 + release;
    const noteGain = audioCtx.createGain();
    noteGain.connect(clipper);
    noteGain.gain.setValueAtTime(0, startTime);
    noteGain.gain.linearRampToValueAtTime(vel, startTime + attack);
    noteGain.gain.exponentialRampToValueAtTime(sustain, startTime + attack + decay);
    noteGain.gain.setValueAtTime(sustain, startTime + 1.7);
    noteGain.gain.exponentialRampToValueAtTime(0.0001, startTime + totalLen);

    PARTIALS.forEach(([mult, amp, detune, type], idx) => {
      const osc = audioCtx.createOscillator();
      const hGain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq * mult, startTime);
      osc.detune.setValueAtTime(detune + (Math.random() - 0.5) * 1.2, startTime);
      hGain.gain.setValueAtTime(amp * vel, startTime + attack);
      hGain.gain.exponentialRampToValueAtTime(amp * vel * 0.05, startTime + attack + PARTIAL_DECAY[idx]);
      hGain.gain.exponentialRampToValueAtTime(0.0001, startTime + totalLen);
      osc.connect(hGain);
      hGain.connect(noteGain);
      osc.start(startTime);
      osc.stop(startTime + totalLen + 0.05);
    });

    const thudOsc = audioCtx.createOscillator(), thudGain = audioCtx.createGain();
    thudOsc.type = 'sine';
    thudOsc.frequency.setValueAtTime(freq * 0.5, startTime);
    thudOsc.frequency.exponentialRampToValueAtTime(freq * 0.12, startTime + 0.025);
    thudGain.gain.setValueAtTime(0.18 * vel, startTime);
    thudGain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.04);
    thudOsc.connect(thudGain);
    thudGain.connect(clipper);
    thudOsc.start(startTime);
    thudOsc.stop(startTime + 0.05);

    const sympOsc = audioCtx.createOscillator(), sympGain = audioCtx.createGain();
    sympOsc.type = 'sine';
    sympOsc.frequency.setValueAtTime(freq * 2.003, startTime);
    sympGain.gain.setValueAtTime(0, startTime + attack);
    sympGain.gain.linearRampToValueAtTime(0.014 * vel, startTime + attack + 0.15);
    sympGain.gain.exponentialRampToValueAtTime(0.0001, startTime + 1.7 + release);
    sympOsc.connect(sympGain);
    sympGain.connect(clipper);
    sympOsc.start(startTime + attack);
    sympOsc.stop(startTime + totalLen + 0.05);
  }

  /* ---------- Sampled piano ----------
     Steinway Model B, mf dynamic, University of Iowa Electronic Music Studios
     (https://theremin.music.uiowa.edu/MISpiano.html). One sample every minor third
     (C, Eb, Gb, A from C2 to C6); each note plays the nearest sample, pitch-shifted

  const sampleBank = [];   // [{ midi, f0, buffer }]
  let samplesReady = false;

  function b64ToArrayBuffer(b64) {
    const bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  function decodeAudio(ab) {
    // Promise form first, callback form for older Safari
    return new Promise((resolve, reject) => {
      const p = audioCtx.decodeAudioData(ab, resolve, reject);
      if (p && p.catch) p.catch(reject);
    });
  }

  async function loadSamples() {
    const keys = Object.keys(PIANO_SAMPLES);
    if (!keys.length) return false;
    try {
      const decoded = await Promise.all(keys.map(async k => ({
        midi: +k,
        f0: PIANO_SAMPLES[k].f,
        buffer: await decodeAudio(b64ToArrayBuffer(PIANO_SAMPLES[k].b64))
      })));
      sampleBank.push(...decoded);
      samplesReady = true;
      // The recordings already contain room sound and natural beating,
      // so back off the synthetic reverb and chorus
      reverbGain.gain.value = 0.06;
      chorusGains.forEach(g => { g.gain.value = 0.02; });
      return true;
    } catch (e) {
      console.warn('Piano samples failed to load, using synth', e);
      return false;
    }
  }

  function playSampleNote(freq, startTime, velocity) {
    const vel = velocity || 0.8;
    const midi = 69 + 12 * Math.log2(freq / 440);
    let best = sampleBank[0];
    for (const s of sampleBank) {
      if (Math.abs(s.midi - midi) < Math.abs(best.midi - midi)) best = s;
    }
    const src = audioCtx.createBufferSource();
    src.buffer = best.buffer;
    src.playbackRate.value = freq / best.f0;   // retunes to exact equal temperament
    const g = audioCtx.createGain();
    g.gain.value = vel * 0.7;   // headroom for two notes sounding together
    src.connect(g);
    g.connect(clipper);
    src.start(startTime);
  }

  function playNote(freq, startTime, velocity) {
    if (samplesReady) playSampleNote(freq, startTime, velocity);
    else playSynthNote(freq, startTime, velocity);
  }

  /* ---------- App state ---------- */
  let q = null;                 // current question
  let playHarmonic = false;     // playback style
  let streak = 0, totalScore = 0, totalAnswered = 0, firstTryCorrect = 0;
  let nextTimer = null, listenTimer = null;
  let answered = false;

  const settings = {
    types: new Set(['staff', 'names', 'ear']),
    dirs:  new Set(['asc', 'desc']),
    clefs: new Set(['treble', 'bass'])
  };

  function playSound() {
    if (!audioCtx || !q) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const f1 = freqOf(q.rootMidi), f2 = freqOf(q.tMidi);
    const now = audioCtx.currentTime + 0.02;
    if (playHarmonic) {
      playNote(f1, now, 0.78);
      playNote(f2, now, 0.78);
    } else {
      playNote(f1, now, 0.85);
      playNote(f2, now + 0.65, 0.85);
    }
  }

  function setHarm(val) {
    playHarmonic = val;
    document.getElementById('harmBtn').classList.toggle('active', playHarmonic);
  }

  function toggleHarm() {
    setHarm(!playHarmonic);
    // Switching style mid-question replays it that way
    playSound();
  }

  /* ---------- Settings chips ---------- */
  function wireChips(groupId, attr, set) {
    document.getElementById(groupId).addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      const val = chip.dataset[attr];
      if (set.has(val)) {
        if (set.size === 1) return;   // always keep at least one option on
        set.delete(val);
        chip.classList.remove('on');
      } else {
        set.add(val);
        chip.classList.add('on');
      }
    });
  }

  function updateAccuracy() {
    document.getElementById('accuracy').textContent =
      totalAnswered ? Math.round(100 * firstTryCorrect / totalAnswered) + '%' : '\u2013';
  }

  function setOptionsDisabled(disabled) {
    INTERVAL_KEYS.forEach(n => {
      const b = document.getElementById('btn-' + n);
      if (b) b.disabled = disabled;
    });
  }

  /* ---------- Flow ---------- */
  async function startApp() {
    initAudio();
    document.getElementById('startScreen').querySelector('.btn-start').textContent = 'Loading piano…';
    await loadSamples();   // falls back to the synth if this fails
    wireChips('typeChips', 'type', settings.types);
    wireChips('dirChips', 'dir', settings.dirs);
    wireChips('clefChips', 'clef', settings.clefs);

    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.remove('hidden');
    const g = document.getElementById('grid');
    g.innerHTML = '';
    INTERVAL_KEYS.forEach(name => {
      const b = document.createElement('button');
      b.className = 'btn-opt';
      b.id = 'btn-' + name;
      b.textContent = name;
      b.onclick = () => check(name);
      g.appendChild(b);
    });
    next();
  }

  function next() {
    clearTimeout(nextTimer);
    clearTimeout(listenTimer);
    answered = false;
    document.getElementById('feedback').textContent = '';
    INTERVAL_KEYS.forEach(n => {
      const b = document.getElementById('btn-' + n);
      if (b) { b.classList.remove('correct', 'wrong'); b.disabled = false; }
    });

    const type  = pick([...settings.types]);
    const desc  = pick([...settings.dirs]) === 'desc';
    const clef  = pick([...settings.clefs]);
    const name  = pick(INTERVAL_KEYS);
    q = buildQuestion(name, desc, clef);
    q.type = type;
    q.missed = false;

    const label = document.getElementById('modeLabel');
    const box = document.getElementById('qBox');
    const dirText = desc ? 'Descending' : 'Ascending';

    if (type === 'staff') {
      // Notation question: random melodic/harmonic presentation
      q.harmonic = Math.random() > 0.5;
      setHarm(q.harmonic);
      label.textContent = 'Staff Identification \u00B7 ' + (q.harmonic ? 'Harmonic' : 'Melodic \u00B7 ' + dirText);
      document.getElementById('hearRow').classList.add('hidden');
      showStaff(q, q.harmonic);
    } else if (type === 'names') {
      q.harmonic = false;
      setHarm(false);
      label.textContent = 'Letter Identification \u00b7 ' + dirText;
      document.getElementById('hearRow').classList.add('hidden');
      box.classList.remove('staff');
      box.textContent = noteName(q.root) + ' ' + dirArrow(q) + ' ' + noteName(q.target);
    } else {
      q.harmonic = Math.random() > 0.5;
      setHarm(q.harmonic);
      label.textContent = 'Sound Identification \u00B7 ' + dirText + ' \u00B7 ' + (q.harmonic ? 'Harmonic' : 'Melodic');
      document.getElementById('hearRow').classList.remove('hidden');
      box.classList.remove('staff');
      box.textContent = '?';
      listenTimer = setTimeout(playSound, 350);
    }
  }

  // After an ear question is answered, show what it looked like on the staff
  function showNotationForEar() {
    if (q.type === 'ear') showStaff(q, playHarmonic);
  }

  function finishQuestion(delay) {
    answered = true;
    setOptionsDisabled(true);
    nextTimer = setTimeout(next, delay);
  }

  function check(val) {
    if (answered) return;
    const f = document.getElementById('feedback');
    if (val === q.interval) {
      totalAnswered++;
      if (!q.missed) {
        firstTryCorrect++;
        streak++;
        totalScore += 10 + (streak > 1 ? (streak - 1) * 2 : 0);
      }
      document.getElementById('streak').textContent = streak;
      document.getElementById('score').textContent = totalScore;
      updateAccuracy();
      document.getElementById('btn-' + val).classList.add('correct');
      f.textContent = !q.missed
        ? (streak > 2 ? '\u2713 Correct! ' + streak + ' in a row!' : '\u2713 Correct!')
        : '\u2713 Got it \u2014 ' + INTERVALS[q.interval].long;
      f.style.color = '#1a8a4a';

      let delay = 1200;
      if (q.type === 'ear') { showNotationForEar(); delay = 2200; }
      if (q.type === 'staff') { playSound(); delay = 2200; }
      finishQuestion(delay);
    } else {
      q.missed = true;
      streak = 0;
      document.getElementById('streak').textContent = 0;
      const b = document.getElementById('btn-' + val);
      b.classList.add('wrong');
      b.disabled = true;
      f.textContent = '\u2717 Try again';
      f.style.color = '#c0392b';
    }
  }

  function revealAnswer() {
    if (answered) return;
    const f = document.getElementById('feedback');
    f.textContent = 'Answer: ' + q.interval + ' (' + INTERVALS[q.interval].long + ')';
    f.style.color = '#e67e22';
    const b = document.getElementById('btn-' + q.interval);
    if (b) { b.disabled = false; b.classList.add('correct'); }
    q.missed = true;
    totalAnswered++;
    streak = 0;
    document.getElementById('streak').textContent = 0;
    updateAccuracy();
    showNotationForEar();
    playSound();
    finishQuestion(3200);
  }
</script>
</body>
</html>
